map $scheme $pl_website_hsts {
    default "";
    https "max-age=31536000";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Security headers are repeated in every location that sets its own add_header (nginx does not inherit them).
    add_header Cache-Control "public, max-age=600, must-revalidate";
    add_header Strict-Transport-Security $pl_website_hsts always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;
    gzip_vary on;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Historical flat pages now live at directory URLs.
    location = /credits.html { return 301 /credits/; }
    location = /index.html {
        # Only redirect a browser's explicit URL, not nginx's internal directory index.
        if ($request_uri ~ "^/index[.]html(?:[?]|$)") { return 301 /; }
    }

    # Versioned assets (site.css?v=…, site.js?v=…, fonts) can be cached for a year.
    location ~* \.(css|js|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security $pl_website_hsts always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Captures and photographs are replaced in place; keep the cache short.
    location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security $pl_website_hsts always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|news/feed\.xml|site\.webmanifest|ai/.*\.json|\.well-known/ai\.txt)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security $pl_website_hsts always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /llms.txt { default_type text/plain; }
    location = /site.webmanifest { default_type application/manifest+json; }
    location ^~ /.well-known/ { try_files $uri =404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header Strict-Transport-Security $pl_website_hsts always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ~ /\. { deny all; }
}

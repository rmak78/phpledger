name: Bug report
description: Report a reproducible problem using sanitized, sample examples.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        PHP Ledger is under development. Describe the behavior in the new application and do not include passwords, tokens, customer records, or database backups. Use sample examples and sanitized logs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the branch or commit and whether this is the new application or legacy code.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include PHP/MySQL or Docker versions, operating system, and browser when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the route, task, role, and sample inputs needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error and whether the work was draft, saved, posted, or reversed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and impact
      description: Optional logs or screenshots. Explain any incorrect totals, lost work, or access concerns without sharing private information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I have removed secrets and real customer data from this report.
          required: true

name: Feature request
description: Explain a user task and the outcome that would make it easier.
title: "Feature: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the business task before proposing a solution. Roadmap items are future plans, not current capabilities or release commitments. Do not include customer records or private information.
  - type: textarea
    id: audience
    attributes:
      label: Who needs this and when?
      description: Describe the business type, user role, and task.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current difficulty
      description: Explain the current workflow and any workaround.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what success looks like and how it could be checked.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Accounting, access, or roadmap context
      description: Note affected reports, permissions, existing roadmap items, or alternatives. Separate general accounting needs from country-specific rules.

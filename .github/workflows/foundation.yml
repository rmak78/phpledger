name: Foundation checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PL_DB_PASSWORD: ci-local-only
      PL_DB_ROOT_PASSWORD: ci-local-root-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the PHP 8.5 foundation
        run: docker compose --profile test build test
      - name: Validate the dependency manifest
        run: docker compose --profile test run --rm test composer validate --no-interaction
      - name: Audit locked public dependencies
        run: docker compose --profile test run --rm test composer audit --no-interaction
      - name: Lint, static analysis, sample data, and isolated MySQL tests
        run: docker compose --profile test run --rm test
      - name: Verify a backup in an isolated restore database
        shell: pwsh
        run: ./tools/verify-backup-restore.ps1
      - name: Stop disposable CI services
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

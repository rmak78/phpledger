name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

# The action uses the base repository only. Never check out or execute PR code here.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-signatures-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check or record the version 1 CLA
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1; upstream archived 2026-03-23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/rmak78/phpledger/blob/master/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          # Only explicitly named dependency bots are exempt, not human contributors.
          allowlist: dependabot[bot],renovate[bot]
          lock-pullrequest-aftermerge: false

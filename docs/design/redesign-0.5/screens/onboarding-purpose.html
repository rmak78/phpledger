<div class="auth-panel">
  <div class="flex items-start justify-between gap-4">

    <div>
      <fieldset class="flex flex-col gap-2.5" data-fold="options">

          <input type="radio" name="start-mode">

            <span class="option-card-desc block">Begin with no opening balances or unpaid invoices.</span>
          </span>
        </label>

          <input type="radio" name="start-mode" checked>
          <span class="option-card-body">
            <span class="option-card-title">Bring past records</span>

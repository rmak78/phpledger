<div class="auth-panel">
  <h1 class="page-title text-center">Sign in</h1>
  <p class="mt-1.5 text-center text-sm text-ink-muted">Sign in to work with your business books.</p>
  <div class="alert alert-danger mt-4" role="alert" tabindex="-1">
    <i data-icon="alert-triangle" class="icon"></i>
    <div><span class="alert-title">We could not sign you in.</span><p>That email or password is incorrect.</p></div>
  </div>
  <form class="mt-4 flex flex-col gap-4">
    <div class="field">
      <label class="field-label" for="login-email">Email address</label>
      <input class="input" id="login-email" type="email" autocomplete="username" required value="ayesha@ravitextile.sample">
    </div>
    <div class="field">
      <label class="field-label" for="login-password">Password</label>
      <input class="input" id="login-password" type="password" autocomplete="current-password" required>
    </div>
    <button type="button" class="btn btn-primary w-full justify-center" data-fold="primary action">Sign in</button>
  </form>
  <p class="mt-5 text-center text-xs text-ink-muted">Your administrator provides your account. If you need access or a password reset, contact the person who manages this installation.</p>
</div>
